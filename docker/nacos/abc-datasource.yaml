# Shared config (Docker profile): MySQL datasource
# 由 docker/init-nacos.sh 发布，dataId=abc-datasource.yaml
# 与 sql/nacos/abc-datasource.yaml 的差别：端口 3307->3306、host 127.0.0.1->mysql
# （3307 只是宿主机映射端口，容器之间走 3306）
spring:
  datasource:
    url: jdbc:mysql://mysql:3306/abc_anime?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
