# ── ABC Bangumi 元数据反代网关 ─────────────────────────────────
# 作用：把境外/易变的 Bangumi 镜像收敛到本项目内部一个稳定地址，
#       后端只需指向 http://abc-bgm-gateway ，镜像挂了改这里即可，不必改代码。
# 用法：在 anime-service 配置 abc.bangumi.mirrors 里把它放最后（或最前）作为一层：
#       abc.bangumi.mirrors=https://bgmapi.anibt.net,https://api.bgmapi.com,http://abc-bgm-gateway
#
# 说明：这里只反代一个主镜像；多镜像的故障转移在 Java 侧（BangumiDataSource）完成。
#       如需在网关层也做多上游 failover，可改用 upstream 块 + proxy_next_upstream。

server {
    listen 80;
    server_name _;

    # 统一注入合规 User-Agent（Bangumi 要求 UA 标识调用方）
    proxy_set_header User-Agent "AnimeBilibiliCloud/1.0 (https://github.com/abc; contact@abc.com)";
    proxy_set_header Accept "application/json";

    # 上游主镜像（可替换为任意可用镜像，如 api.bgmapi.com）
    location / {
        proxy_pass https://bgmapi.anibt.net;
        proxy_ssl_server_name on;              # 关键：发出 SNI，否则上游 TLS 握手可能失败
        proxy_set_header Host bgmapi.anibt.net;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_connect_timeout 8s;
        proxy_read_timeout 15s;

        # 上游 5xx 时返回 502，交给 Java 侧切换下一个镜像
        proxy_intercept_errors off;
    }
}
