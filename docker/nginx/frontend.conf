# ============================================================
# 前端 nginx：托管 Vite 产物 + 把 /api /ws /uploads 反代到后端微服务
# 与开发环境 abc-frontend/vite.config.ts 的 proxy 保持一致（保持"开发/生产同构"）
#   /api     -> 网关 abc-gateway:8080（网关再按 Path 前缀路由到 10 个微服务）
#   /ws      -> 弹幕服务 abc-danmaku-service:8085（WebSocket 需 Upgrade 头）
#   /uploads -> 视频服务 abc-video-service:8084（静态视频/封面）
# ============================================================
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 视频上传走 /api/video/upload（500MB 上限），nginx 默认 1MB 会直接 413
    client_max_body_size 512m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Vue Router history 模式：刷新子路由时回退到 index.html，避免 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态产物带 hash，可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://abc-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 服务是 SSE 流式输出：关闭缓冲，否则前端要等整段生成完才显示
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /ws/ {
        proxy_pass http://abc-danmaku-service:8085;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /uploads/ {
        proxy_pass http://abc-video-service:8084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
    }
}
