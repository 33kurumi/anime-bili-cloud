# Shared config: MySQL datasource (all services using MySQL)
# Note: all services share one DB (abc_anime) as in the original project.
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/abc_anime?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
