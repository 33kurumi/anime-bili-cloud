version: '3.8'

# ═══════════════════════════════════════════════════════════════
# Anime Bilibili Cloud — Infrastructure Stack
# ═══════════════════════════════════════════════════════════════

services:

  # ── MySQL 8.0 ──────────────────────────────────────────────
  mysql:
    image: mysql:8.0.33
    container_name: abc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: abc_anime
      MYSQL_USER: abc
      MYSQL_PASSWORD: abc123
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./sql/abc_anime.sql:/docker-entrypoint-initdb.d/02-abc_anime.sql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=200
    networks:
      - abc-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 5.0 ──────────────────────────────────────────────
  redis:
    image: redis:5.0.14-alpine
    container_name: abc-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass redis123
    networks:
      - abc-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MongoDB 5.0.5 ──────────────────────────────────────────
  mongodb:
    image: mongo:5.0.5
    container_name: abc-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: mongo123
      MONGO_INITDB_DATABASE: abc_danmaku
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./sql/mongo-init.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - abc-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ElasticSearch 7.17.27 ──────────────────────────────────
  elasticsearch:
    image: elasticsearch:7.17.27
    container_name: abc-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - bootstrap.memory_lock=true
    ports:
      - "9200:9200"
      - "9300:9300"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - abc-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 20s
      timeout: 10s
      retries: 10

  # ── RocketMQ NameServer ────────────────────────────────────
  rocketmq-namesrv:
    image: apache/rocketmq:5.1.4
    container_name: abc-rmq-namesrv
    restart: unless-stopped
    ports:
      - "9876:9876"
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    volumes:
      - rmq_ns_data:/home/rocketmq/logs
    networks:
      - abc-network
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -v grep | grep mqnamesrv || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── RocketMQ Broker ────────────────────────────────────────
  rocketmq-broker:
    image: apache/rocketmq:5.1.4
    container_name: abc-rmq-broker
    restart: unless-stopped
    user: root
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    ports:
      - "10909:10909"
      - "10911:10911"
    command: sh mqbroker -n rocketmq-namesrv:9876 --enable-proxy
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m"
      NAMESRV_ADDR: rocketmq-namesrv:9876
    volumes:
      - rmq_broker_data:/home/rocketmq/logs
      - rmq_store_data:/home/rocketmq/store
    networks:
      - abc-network
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -v grep | grep mqbroker || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 10s

  # ── Nacos 2.x (Standalone) ─────────────────────────────────
  nacos:
    image: nacos/nacos-server:v2.3.1
    container_name: abc-nacos
    restart: unless-stopped
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
      # 开启鉴权：控制台需登录（nacos/nacos）；各微服务在 bootstrap.yml 的
      # spring.cloud.nacos.config 下必须带 username/password，否则 403 user not found
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_TOKEN=SecretKey012345678901234567890123456789012345678901234567890123456789
      - NACOS_AUTH_IDENTITY_KEY=nacos
      - NACOS_AUTH_IDENTITY_VALUE=nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos_data:/home/nacos/data
    networks:
      - abc-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u nacos:nacos http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 15s
      timeout: 10s
      retries: 8

  # ── Bangumi 元数据反代网关（可选，推荐）────────────────────
  # 把易变的境外 Bangumi 镜像收敛为项目内稳定地址 http://abc-bgm-gateway
  # 启用方式：docker-compose up -d abc-bgm-gateway
  #          并在 anime-service 配置 abc.bangumi.mirrors 追加 http://abc-bgm-gateway
  abc-bgm-gateway:
    image: nginx:1.27-alpine
    container_name: abc-bgm-gateway
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./docker/nginx/bangumi.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - abc-network

# ═══════════════════════════════════════════════════════════════
volumes:
  mysql_data:
  redis_data:
  mongo_data:
  es_data:
  rmq_ns_data:
  rmq_broker_data:
  rmq_store_data:
  nacos_data:

# ═══════════════════════════════════════════════════════════════
networks:
  abc-network:
    driver: bridge
