<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>HLS 播放测试（独立于项目）</title>
  <style>body{font-family:system-ui;padding:20px} #v{width:800px;background:#000;margin-top:10px;display:block} pre{background:#f5f5f5;padding:10px;white-space:pre-wrap;max-height:300px;overflow:auto}</style>
</head>
<body>
  <h3>HLS 播放测试（直接用 hls.js，绕过项目代码）</h3>
  <p>m3u8 地址：<input id="u" style="width:640px" value="https://vip1.lz-cdn5.com/20220607/23136_21f60cfb/index.m3u8">
    <button onclick="load()">播放</button></p>
  <video id="v" controls></video>
  <pre id="log"></pre>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <script>
    const out = document.getElementById('log');
    function log(m){ out.textContent += m + "\n"; console.log(m); }
    function load(){
      out.textContent = "";
      const url = document.getElementById('u').value.trim();
      const v = document.getElementById('v');
      const Hls = window.Hls;
      log("window.Hls 可用: " + !!Hls + (Hls ? " | isSupported=" + Hls.isSupported() : ""));
      if (window.dp_hls) { try{ window.dp_hls.destroy(); }catch(e){} }
      if (Hls && Hls.isSupported()) {
        const h = new Hls();
        window.dp_hls = h;
        h.on(Hls.Events.ERROR, (e, d) => log("HLS ERROR: type=" + d.type + " details=" + d.details + " fatal=" + d.fatal));
        h.on(Hls.Events.MANIFEST_PARSED, () => { log("清单已解析，开始播放…"); v.play().catch(err => log("play() 被拒: " + err.message)); });
        h.loadSource(url);
        h.attachMedia(v);
      } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
        log("使用浏览器原生 HLS（Safari）");
        v.src = url; v.play();
      } else {
        log("浏览器不支持 HLS，且 hls.js 未加载（可能 jsdelivr 被墙）");
      }
    }
  </script>
</body>
</html>
